<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ownward</title>
  <link rel="stylesheet" href="window.css">
  <script type="module" src="bootstrap.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <div id="entry" class="entry" data-phase="opening">
    <div class="wordmark">ownward</div>
    <div class="entry-progress" aria-hidden="true"></div>
    <h1 id="entry-title">正在打开你的资料</h1>
    <p id="status" role="status">稍等片刻，即可继续。</p>
    <button id="entry-retry" class="button primary" type="button" hidden>再试一次</button>
    <details id="entry-help" class="entry-help" hidden><summary>如何打开 Ownward</summary>
      <p>在电脑的应用搜索中找到 Ownward，点击打开。</p>
      <p class="subtle">也可以请智能体“打开 Ownward”。无需查找网址或运行命令。</p>
    </details>
  </div>
  <div id="shell" hidden>
    <aside class="sidebar">
      <button id="home-entry" class="wordmark" type="button" aria-label="Ownward 首页">Ownward</button>
      <nav id="navigation" aria-label="主要导航"></nav>
      <span id="health-state" class="health-state" role="status" hidden></span>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span id="connection-state" role="status" hidden></span>
      </header>
      <div class="pending-area">
        <button id="pending-entry" class="button pending-strip" type="button" aria-expanded="false" aria-controls="pending-panel" hidden>待确认 <span id="pending-count"></span></button>
        <section id="pending-panel" class="pending-panel" aria-label="待确认事项" hidden></section>
      </div>
      <div id="notice" role="status" hidden></div>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
</body>
</html>
