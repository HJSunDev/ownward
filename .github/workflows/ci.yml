name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify modules
        run: go mod verify

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Test Python verification tools
        shell: bash
        run: |
          PYTHONPATH=benchmarks/acceptance/dynamic python -m unittest discover -s benchmarks/acceptance/dynamic -p 'test_*.py'
          PYTHONPATH=benchmarks/agent_integration python -m unittest discover -s benchmarks/agent_integration -p 'test_*.py'
          PYTHONPATH=benchmarks/resource_frontier python -m unittest discover -s benchmarks/resource_frontier -p 'test_*.py'
          PYTHONPATH=benchmarks/final_acceptance python -m unittest discover -s benchmarks/final_acceptance -p 'test_*.py'
          python -m unittest discover -s benchmarks/longmemeval_v2 -p 'test_*.py'
          python -m py_compile benchmarks/resource_frontier/tam_benchmark.py
          python -m py_compile benchmarks/final_acceptance/official_validate.py
