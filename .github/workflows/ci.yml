name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Test benchmark adapters
        shell: bash
        run: |
          python -m unittest discover -s benchmarks/longmemeval_v2 -p "test_*.py"
          PYTHONPATH=benchmarks/agent_integration python -m unittest discover -s benchmarks/agent_integration -p "test_*.py"
          PYTHONPATH=benchmarks/resource_frontier python -m unittest discover -s benchmarks/resource_frontier -p "test_*.py"
          PYTHONPATH=benchmarks/final_acceptance python -m unittest discover -s benchmarks/final_acceptance -p "test_*.py"
          python -m py_compile benchmarks/resource_frontier/tam_benchmark.py
          python -m py_compile benchmarks/final_acceptance/official_validate.py
      - name: Build
        run: go build ./...

  platforms:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build ./...
